<nav class="navbar">
  <div class="left">
    <img
      src="assets/images/logini.png"
      class="logo"
      alt="Logotipo de INIFAP"
    />
  </div>
<button
  type="button"
  class="menu-toggle"
  (click)="alternarMenu()"
  [attr.aria-expanded]="menuAbierto"
  aria-label="Abrir menú de navegación"
>
  {{ menuAbierto ? '✕' : '☰' }}
</button>
  <div class="right nav-links" [class.menu-abierto]="menuAbierto">
    <button
      type="button"
      (click)="irAcercaDe(); cerrarMenu()"
    >
      Acerca de…
    </button>

    <button
      type="button"
      (click)="irMapa(); cerrarMenu()"
    >
      Mapa
    </button>

    @if (authService.esAdmin()) {
      <button
        type="button"
        (click)="irUsuarios(); cerrarMenu()"
      >
        Usuarios
      </button>
    }

    <button
      type="button"
      class="logout"
      (click)="logout(); cerrarMenu()"
    >
      Logout
    </button>
  </div>
</nav>
